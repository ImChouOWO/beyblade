name: Apply BeyTail recording update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-beytail-recording-update.yml

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore update package
        shell: bash
        run: |
          set -euo pipefail
          cat .beytail_update/part_*.txt > /tmp/beytail_update.zip.b64
          base64 --decode /tmp/beytail_update.zip.b64 > /tmp/beytail_update.zip
          mkdir -p /tmp/beytail_update
          unzip -q /tmp/beytail_update.zip -d /tmp/beytail_update

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/beytail_update/BeyTail_Audio_Fullscreen_Preview

          cp "$ROOT/beyblade/BeyTail/Camera/CameraManager.swift" \
             beyblade/BeyTail/Camera/CameraManager.swift
          cp "$ROOT/beyblade/BeyTail/Recording/RecordingManager.swift" \
             beyblade/BeyTail/Recording/RecordingManager.swift
          cp "$ROOT/beyblade/BeyTail/UI/MainViewModel.swift" \
             beyblade/BeyTail/UI/MainViewModel.swift
          cp "$ROOT/beyblade/BeyTail/UI/RecordingCompletionSheet.swift" \
             beyblade/BeyTail/UI/RecordingCompletionSheet.swift

          python3 "$ROOT/tools/apply_contentview_recording_fullscreen.py" \
             beyblade/BeyTail/UI/ContentView.swift

          rm -f beyblade/BeyTail/UI/ContentView.swift.before_recording_fullscreen

      - name: Validate applied files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'var onAudioFrame' beyblade/BeyTail/Camera/CameraManager.swift
          grep -q 'kCVPixelFormatType_32BGRA' beyblade/BeyTail/Camera/CameraManager.swift
          grep -q 'private var audioInput: AVAssetWriterInput?' beyblade/BeyTail/Recording/RecordingManager.swift
          grep -q 'prepareAudioCaptureAsync' beyblade/BeyTail/UI/MainViewModel.swift
          grep -q 'private let screenEdgeSpacing: CGFloat = 10' beyblade/BeyTail/UI/RecordingCompletionSheet.swift
          grep -q '\.fullScreenCover(' beyblade/BeyTail/UI/ContentView.swift

      - name: Commit final update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .beytail_update
          rm -f .github/workflows/apply-beytail-recording-update.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A
          git commit -m 'Add recording audio and full-screen preview'
          git push origin HEAD:main
