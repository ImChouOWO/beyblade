name: Fix Swift concurrency warnings

on:
  push:
    paths:
      - .github/workflows/fix-swift-concurrency-warnings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal Swift fixes
        shell: bash
        run: |
          set -euo pipefail

          REC="beyblade/BeyTail/Recording/RecordingManager.swift"
          PIC="beyblade/BeyTail/UI/pic/icon/PicTrailSceneBuilder.swift"
          VIDEO="beyblade/BeyTail/Video/VideoRenderProcessor.swift"

          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/Recording/RecordingManager.swift"); s=p.read_text(); old="                    let status = writer.status\n                    let errorMessage = writer.error?.localizedDescription"; new="                    guard let currentWriter = self.writer else {\n                        self.resetOnQueue(cancelWriter: false)\n                        completion(nil)\n                        return\n                    }\n\n                    let status = currentWriter.status\n                    let errorMessage = currentWriter.error?.localizedDescription"; assert old in s, "RecordingManager target block not found"; p.write_text(s.replace(old,new,1))'

          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/pic/icon/PicTrailSceneBuilder.swift"); s=p.read_text(); old="= { [self] j, life, normal in"; count=s.count(old); assert count == 3, f"Expected 3 unused self captures, got {count}"; p.write_text(s.replace(old,"= { j, life, normal in"))'

          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/Video/VideoRenderProcessor.swift"); s=p.read_text(); old="    private let stateLock = NSLock()\n    private var isCancelled = false"; new="    nonisolated(unsafe) private let stateLock = NSLock()\n    nonisolated(unsafe) private var isCancelled = false"; assert old in s, "VideoRenderProcessor state block not found"; s=s.replace(old,new,1); old2="    private var cancelled: Bool {"; assert old2 in s, "cancelled getter not found"; s=s.replace(old2,"    nonisolated private var cancelled: Bool {",1); old3="    private func setCancelled(\n        _ value: Bool\n    ) {"; assert old3 in s, "setCancelled not found"; s=s.replace(old3,"    nonisolated private func setCancelled(\n        _ value: Bool\n    ) {",1); p.write_text(s)'

          git diff --check
          git diff -- "$REC" "$PIC" "$VIDEO"

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-swift-concurrency-warnings.yml
          git add beyblade/BeyTail/Recording/RecordingManager.swift beyblade/BeyTail/UI/pic/icon/PicTrailSceneBuilder.swift beyblade/BeyTail/Video/VideoRenderProcessor.swift
          git commit -m "Fix Swift concurrency diagnostics"
          git push origin HEAD:main
