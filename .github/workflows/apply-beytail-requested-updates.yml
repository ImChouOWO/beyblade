name: Apply BeyTail requested updates

on:
  push:
    paths:
      - .github/workflows/apply-beytail-requested-updates.yml

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Swift sources
        shell: bash
        run: |
          set -euo pipefail

          CONTENT="beyblade/BeyTail/UI/ContentView.swift"
          SETTINGS="beyblade/BeyTail/UI/SettingsSheetView.swift"

          # Top bar: BEY TAIL and gear stay in the same HStack/vertical center.
          sed -i 's/private let topBarHeight: CGFloat = 40/private let topBarHeight: CGFloat = 44/' "$CONTENT"
          sed -i 's/private let topBarTopPadding: CGFloat = 10/private let topBarTopPadding: CGFloat = 8/' "$CONTENT"
          sed -i 's/private var topBarLayer: some View {/private func topBarLayer(safeAreaTop: CGFloat) -> some View {/' "$CONTENT"
          sed -i 's/y: topBarTopPadding + topBarHeight \/ 2/y: max(safeAreaTop, 16) + topBarTopPadding + topBarHeight \/ 2/' "$CONTENT"
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/ContentView.swift"); s=p.read_text(); old="\n                topBarLayer\n                recognitionStatusLayer"; new="\n                topBarLayer(safeAreaTop: geometry.safeAreaInsets.top)\n                recognitionStatusLayer"; assert old in s, "topBarLayer call not found"; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/ContentView.swift"); s=p.read_text(); a=s.index("    // MARK: - Top Bar\n"); b=s.index("    // MARK: - Hint Bar\n",a); x=s[a:b]; assert ".frame(width: 40, height: 40)" in x, "gear frame not found"; x=x.replace(".frame(width: 40, height: 40)",".frame(width: 44, height: 44)",1); x=x.replace("        .padding(.horizontal, 16)\n        .padding(.top, 8)","        .padding(.horizontal, 16)",1); p.write_text(s[:a]+x+s[b:])'

          # Real StoreKit Offer Code UI.
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/SettingsSheetView.swift"); s=p.read_text(); old="    @Environment(\\.openURL) private var openURL\n\n    @State private var dragOffset: CGFloat = 0"; new="    @Environment(\\.openURL) private var openURL\n\n    @ObservedObject private var purchaseStore =\n        EffectPurchaseStore.shared\n\n    @State private var dragOffset: CGFloat = 0"; assert old in s, "settings environment anchor not found"; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/SettingsSheetView.swift"); s=p.read_text(); old="    @State private var isRestoringPurchases = false\n    @State private var presentedAlert: SettingsAlert?"; new="    @State private var isRestoringPurchases = false\n    @State private var isOfferCodeRedemptionPresented = false\n    @State private var presentedAlert: SettingsAlert?"; assert old in s, "settings state anchor not found"; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/SettingsSheetView.swift"); s=p.read_text(); old="                    settingButton(\n                        systemName: \"lock.fill\",\n                        title: \"隱私權政策\"\n                    ) {\n                        openURL(privacyPolicyURL)\n                    }"; new=old+"\n\n                    settingButton(\n                        systemName: \"ticket.fill\",\n                        title: \"兌換優惠碼\"\n                    ) {\n                        isOfferCodeRedemptionPresented = true\n                    }"; assert old in s, "privacy button not found"; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("beyblade/BeyTail/UI/SettingsSheetView.swift"); s=p.read_text(); old="        .alert(item: $presentedAlert) { alert in\n            Alert(\n                title: Text(alert.title),\n                message: Text(alert.message),\n                dismissButton: .default(Text(\"好\"))\n            )\n        }\n    }"; new="        .alert(item: $presentedAlert) { alert in\n            Alert(\n                title: Text(alert.title),\n                message: Text(alert.message),\n                dismissButton: .default(Text(\"好\"))\n            )\n        }\n        .offerCodeRedemption(\n            isPresented: $isOfferCodeRedemptionPresented\n        ) { result in\n            switch result {\n            case .success:\n                Task { @MainActor in\n                    await purchaseStore.refreshPurchasedProducts()\n                }\n            case .failure(let error):\n                presentedAlert = SettingsAlert(\n                    title: \"兌換失敗\",\n                    message: error.localizedDescription\n                )\n            }\n        }\n    }"; assert old in s, "settings alert anchor not found"; p.write_text(s.replace(old,new,1))'

          # iOS 17 onChange API migration across all Swift sources.
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'(\.onChange\s*\([^{}]*?\)\s*\{)\s*'
              r'([A-Za-z_][A-Za-z0-9_]*|_)\s+in',
              re.DOTALL
          )

          total = 0
          for path in Path("beyblade").rglob("*.swift"):
              text = path.read_text(encoding="utf-8")
              count = [0]

              def repl(match):
                  count[0] += 1
                  prefix, parameter = match.group(1), match.group(2)
                  return prefix if parameter == "_" else f"{prefix} _, {parameter} in"

              updated = pattern.sub(repl, text)
              if count[0]:
                  path.write_text(updated, encoding="utf-8")
                  total += count[0]
                  print(f"{path}: migrated {count[0]} onChange closure(s)")

          if total < 8:
              raise SystemExit(f"Expected at least 8 onChange migrations, got {total}")

          leftovers = [
              str(path)
              for path in Path("beyblade").rglob("*.swift")
              if pattern.search(path.read_text(encoding="utf-8"))
          ]
          if leftovers:
              raise SystemExit("Legacy onChange remains: " + ", ".join(leftovers))

          print(f"Total onChange migrations: {total}")
          PY

          git diff --check
          git diff --stat

      - name: Commit requested source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-beytail-requested-updates.yml
          git add beyblade/BeyTail
          git commit -m "Implement offer code redemption and modernize SwiftUI UI"
          git push origin HEAD:main
