name: Apply BeyTail requested updates

on:
  push:
    paths:
      - .github/workflows/apply-beytail-requested-updates.yml

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Swift sources
        shell: bash
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKcm9vdCA9IFBhdGgoIi4iKQpjb250ZW50X3BhdGggPSByb290IC8gImJleWJsYWRlL0JleVRhaWwvVUkvQ29udGVudFZpZXcuc3dpZnQiCnNldHRpbmdzX3BhdGggPSByb290IC8gImJleWJsYWRlL0Jl ' | tr -d ' ' | base64 --decode > /tmp/beytail_patch.py
          python3 /tmp/beytail_patch.py

      - name: Commit requested source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-beytail-requested-updates.yml
          git add beyblade/BeyTail
          git commit -m "Implement offer code redemption and modernize SwiftUI UI"
          git push origin HEAD:main
